name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 这些是纯 Node、无桌面端依赖的回归资产，CI 里先跑它们。
      # 需要真实 OfficeAce 凭据 / 本机端口的 test-admin、smoke 等留给本机。
      - name: unit tests
        shell: bash
        run: |
          node tools/test-pool-scheduler.mjs
          node tools/test-pool-persistence.mjs
          node tools/test-usage-cache.mjs
          node tools/test-usage-daily.mjs
          node tools/test-call-diagnostics.mjs
          node tools/test-routing.mjs
          node tools/test-http-utils.mjs
          node tools/test-stream-e2e.mjs
          node tools/test-logfmt.mjs
          node tools/test-tps.mjs
          node tools/test-models.mjs
